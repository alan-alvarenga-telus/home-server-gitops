apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Workload layer — user-facing services consuming infrastructure capabilities

  sourceRepos:
    - https://github.com/alan-alvarenga-telus/home-server-gitops.git
    - https://charts.goauthentik.io
    - https://community-charts.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'

  # Apps in this project may declare their own Namespace (with sync-wave: "-1")
  # to dodge ArgoCD's rbacReconcile-before-CreateNamespace race for charts that
  # ship namespaced RBAC. All OTHER cluster-scoped resources remain forbidden
  # — ClusterRole/ClusterRoleBinding/CRDs/etc. must stay in infrastructure/.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
