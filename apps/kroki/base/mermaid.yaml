apiVersion: apps/v1
kind: Deployment
metadata:
  name: kroki-mermaid
  namespace: kroki
  labels:
    app: kroki-mermaid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kroki-mermaid
  template:
    metadata:
      labels:
        app: kroki-mermaid
    spec:
      containers:
        - name: mermaid
          image: yuzutech/kroki-mermaid:latest
          ports:
            - name: http
              containerPort: 8002
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kroki-mermaid
  namespace: kroki
  labels:
    app: kroki-mermaid
spec:
  type: ClusterIP
  selector:
    app: kroki-mermaid
  ports:
    - name: http
      port: 8002
      targetPort: http
