apiVersion: apps/v1
kind: Deployment
metadata:
  name: kroki
  namespace: kroki
  labels:
    app: kroki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kroki
  template:
    metadata:
      labels:
        app: kroki
    spec:
      enableServiceLinks: false
      containers:
        - name: kroki
          image: yuzutech/kroki:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            # Vert.x rejects request lines longer than this with 414. Default is
            # 4000 — too small for large PlantUML diagrams the jebbs extension
            # deflate-encodes into the GET URL. Raise the ceiling (64 KB) for our
            # single-tenant LAN box; POST would remove the limit entirely but the
            # extension only speaks GET.
            - name: KROKI_MAX_URI_LENGTH
              value: "64000"
            - name: KROKI_MERMAID_HOST
              value: kroki-mermaid
            - name: KROKI_BPMN_HOST
              value: kroki-bpmn
            - name: KROKI_EXCALIDRAW_HOST
              value: kroki-excalidraw
            # UNSAFE enables `theme <url>` fetching (e.g. static.structurizr.com
            # cloud icon themes). Scoped to Structurizr only — PlantUML/Mermaid
            # stay in SECURE mode. Tolerable on this single-tenant LAN cluster.
            - name: KROKI_STRUCTURIZR_SAFE_MODE
              value: UNSAFE
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
