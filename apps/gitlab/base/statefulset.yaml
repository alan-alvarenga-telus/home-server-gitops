apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  # StatefulSet, not Deployment: this is a singleton stateful workload on
  # local-path (RWO-only) storage, same reasoning as CNPG's Cluster in
  # apps/postgres. volumeClaimTemplates gives each of the three omnibus data
  # dirs its own PVC lifecycle instead of one PVC juggled by a Deployment.
  serviceName: gitlab
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      enableServiceLinks: false
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:17.5.2-ce.0
          ports:
            - name: http
              containerPort: 80
          env:
            # Omnibus's single entrypoint for reconfiguring gitlab.rb at
            # container start. registry/prometheus are bundled services we
            # don't want here: the registry would duplicate
            # infrastructure/registry (already running at registry.internal),
            # and the monitoring stack costs RAM we don't have to spare on a
            # single node. (grafana['enable'] is NOT set here - GitLab removed
            # bundled Grafana entirely in 16.3; the key no longer exists and
            # setting it crashes the reconfigure with
            # Mixlib::Config::UnknownConfigOptionError.)
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.internal'
                registry['enable'] = false
                gitlab_rails['smtp_enable'] = false
                prometheus_monitoring['enable'] = false
            # Omnibus reads this on first reconfigure only, to set the root
            # user's password instead of generating a random one that expires
            # in 24h. Sealed in the overlay (cluster-specific, like every
            # other secret in this repo).
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-root-password
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: data
              mountPath: /var/opt/gitlab
          resources:
            requests:
              memory: 4Gi
              cpu: "2"
            limits:
              memory: 6Gi
              cpu: "4"
          # startupProbe gates readiness/liveness until it succeeds once -
          # while it's running, a failing readiness/liveness check does NOT
          # restart the container. Needed here: omnibus's first reconfigure
          # brings up gitaly/postgres/redis before workhorse+nginx, and
          # workhorse 404s on /-/readiness until Puma registers behind it -
          # a plain initialDelaySeconds long enough to cover that got beaten
          # by liveness killing the container mid-boot and resetting the
          # whole multi-minute startup clock every time. Budget here: up to
          # 20 * 30s = 10 minutes before we consider first boot itself hung.
          # timeoutSeconds defaults to 1 if unset - too tight for this stack.
          # cgroup cpu.stat on this box already shows real throttling
          # (nr_throttled > 0) under a 2-4 vCPU limit, and GitLab's own Puma/
          # Workhorse can take several seconds to answer under any transient
          # load (a Sidekiq cron tick, asset serving). Without a longer
          # timeout, an otherwise-healthy pod gets killed on a slow response
          # rather than a real failure - this, not boot time, was the actual
          # cause of the repeated crashloop.
          startupProbe:
            httpGet:
              path: /-/readiness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 4Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
