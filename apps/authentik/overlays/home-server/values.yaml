# Helm values for the Authentik chart on the home-server cluster.
# Consumed via $values ref by apps/authentik/application.yaml.
#
# All AUTHENTIK_* env vars (including non-secret config like DB host) live in
# the authentik-env SealedSecret. The chart loads them via envFrom because of
# authentik.existingSecret.secretName below. When existingSecret is set, the
# chart IGNORES values under authentik.* — don't bother setting them here.

authentik:
  enabled: true
  existingSecret:
    secretName: authentik-env

# The bundled authentik-remote-cluster subchart (aliased here as serviceAccount)
# creates ClusterRole+ClusterRoleBinding for managing outposts across
# namespaces. The `apps` AppProject disallows cluster-scoped resources by
# design (see Lesson 3). We're not using outposts, so disable it.
# Keeps the ServiceAccount, Role, and RoleBinding the pods actually need.
serviceAccount:
  clusterRole:
    enabled: false

# External Postgres via the CNPG cluster. Disable the chart's bundled subchart.
# Redis is no longer bundled in chart 2026.5 — we deploy our own via
# overlays/home-server/redis.yaml.
postgresql:
  enabled: false

# Single-node — no extra replicas, no anti-affinity.
# Ingress exposes Authentik via Traefik (k3s default) at http://authentik.internal.
# Workstation needs /etc/hosts: `<traefik-external-ip> authentik.internal`.
# See README "Hostname & Ingress" for the full setup.
server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - authentik.internal
    pathType: Prefix
worker:
  replicas: 1
