# Helm values for the Authentik chart on the home-server cluster.
# Consumed via $values ref by apps/authentik/application.yaml.
#
# All AUTHENTIK_* env vars (including non-secret config like DB host) live in
# the authentik-env SealedSecret. The chart loads them via envFrom because of
# authentik.existingSecret.secretName below. When existingSecret is set, the
# chart IGNORES values under authentik.* — don't bother setting them here.

authentik:
  enabled: true
  existingSecret:
    secretName: authentik-env

# External Postgres via the CNPG cluster. Disable the chart's bundled subchart.
postgresql:
  enabled: false

# Bundled redis is fine for a single-node homelab.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# Single-node — no replicas, no anti-affinity.
server:
  replicas: 1
worker:
  replicas: 1

# No ingress yet — reach via kubectl port-forward.
ingress:
  enabled: false
