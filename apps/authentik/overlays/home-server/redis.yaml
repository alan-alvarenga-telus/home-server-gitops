# Single-node redis for Authentik's session/cache backend.
# The 2026.5 chart no longer bundles redis, so we ship it here.
# In-memory only (no persistence) — Authentik sessions get reset on pod
# restart, acceptable for a homelab.
# Service name must match AUTHENTIK_REDIS__HOST in the sealed env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis-master
  namespace: authentik
  labels:
    app: authentik-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis-master
  namespace: authentik
  labels:
    app: authentik-redis
spec:
  type: ClusterIP
  selector:
    app: authentik-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
