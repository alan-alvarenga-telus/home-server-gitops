# LoadBalancer Service exposing the CNPG primary on the LAN.
# Pairs with the Pi-hole wildcard: postgres.internal → klipper-lb → this Service.
# This is a SEPARATE Service from CNPG's managed postgres-rw (ClusterIP) — we don't
# touch CNPG's services because the operator owns them.
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw-external
  namespace: postgres
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: postgres
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
