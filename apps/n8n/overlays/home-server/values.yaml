# Helm values for the community-charts n8n chart on the home-server cluster.
# Consumed via the $values ref by apps/n8n/application.yaml.

# State lives in the managed CNPG Postgres cluster (apps/postgres), NOT the
# chart's default bundled SQLite. Username is a plain value; the password is
# read from the n8n-db SealedSecret under the key named below.
db:
  type: postgresdb
externalPostgresql:
  host: postgres-rw.postgres.svc.cluster.local
  port: 5432
  database: n8n
  username: n8n
  existingSecret: n8n-db
  existingSecretPasswordKey: password

# Credential-encryption key, generated by us and sealed so it is STABLE across
# pod restarts and cluster rebuilds. n8n encrypts every stored credential with
# it; if the chart auto-generated it onto an ephemeral pod filesystem instead,
# losing the pod would orphan every credential in the database. The referenced
# Secret must expose the key under the name N8N_ENCRYPTION_KEY (chart contract).
existingEncryptionKeySecret: n8n-encryption-key

# Single node: one main process in regular (non-queue) mode, no Redis. Queue
# mode + Redis is a horizontal-scaling convention we defer until needed.
main:
  count: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # The chart does NOT derive these from ingress.hosts. We terminate plain HTTP
  # at Traefik, so N8N_SECURE_COOKIE must be false or the browser refuses the
  # auth cookie over HTTP and login loops. WEBHOOK_URL makes generated webhook
  # URLs resolve correctly on the LAN.
  extraEnvVars:
    N8N_HOST: n8n.internal
    N8N_PROTOCOL: http
    WEBHOOK_URL: http://n8n.internal/
    N8N_SECURE_COOKIE: "false"
    N8N_RUNNERS_ENABLED: "true"

# Browser access via Traefik (k3s default ingress) at http://n8n.internal.
# Workstation/Pi-hole must resolve n8n.internal to the Traefik LoadBalancer IP.
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: n8n.internal
      paths:
        - path: /
          pathType: Prefix
