apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# values.yaml lives in this directory but is NOT a Kubernetes resource —
# it's a Helm values file consumed by the chart source via the $values ref.
# Do NOT list it under resources.
resources:
  - namespace.yaml
  - n8n-db.sealedsecret.yaml
  - n8n-encryption-key.sealedsecret.yaml
