# Explicit namespace so it lands before any namespaced RBAC the chart ships.
# sync-wave -1 applies it before everything else in this Application, dodging
# ArgoCD's rbacReconcile-before-CreateNamespace race. Same pattern as authentik.
apiVersion: v1
kind: Namespace
metadata:
  name: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
